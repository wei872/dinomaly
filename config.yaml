# DinoDefectClassifier config - ViT-S/14 lightweight

data:
  data_root: "./dataset/dino"
  img_size: 518
  num_classes: 9
  class_names:
    - normal
    - small-black-dot
    - non-overlapping-double-latitude
    - folded-edge-not-included
    - feathering
    - small-tail
    - meridian-anomaly
    - latitude-pollution
    - meridian-pollution
  num_workers: 4
  pin_memory: true

model:
  encoder_name: "dinov2_vits14"
  selected_layers: [9, 10, 11]
  bottleneck_dim: 96
  fused_dim: 256
  noise_std: 0.1
  drop_rate: 0.1

train:
  stage1_epochs: 50
  stage1_lr: 0.0001
  stage1_batch_size: 16

  stage2_epochs: 50
  stage2_lr: 0.0005
  stage2_recon_lr: 0.00001
  stage2_batch_size: 16

  weight_decay: 0.05
  max_grad_norm: 1.0
  warmup_epochs: 5
  label_smoothing: 0.1

  lambda_cls: 1.0
  lambda_mask: 1.0
  lambda_recon: 0.5
  lambda_anomaly: 0.3

  save_dir: "./checkpoints"
  log_dir: "./logs"
  save_interval: 5
  eval_interval: 5

device: "cuda"
seed: 42
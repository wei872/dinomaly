# 当前入口: python fabric_pipeline.py train
# 优先级: 命令行 > 本文件 > 脚本默认值
pipeline: fabric_mobilenet
backbone: mobilenet_v3_small_partial
# 类别数及名称仅从该文件的 nc/names 读取：19个已知缺陷类，ID 0-18。
# 未知类型为推理拒识结果 ID 19；正常样本独立建模，不占分类器输出类别。
data: dataset/fabric19.yaml
size: 448
feature_batch_size: 8
workers: 0
cpu_feature_cache: false
epochs: 100
lr: 0.001
seed: 42
checkpoint: checkpoints/fabric_448.pt
quantile: 0.995
min_area: 2
class_threshold: 0.65
margin: 0.15
known_quantile: 0.99
strict_duplicates: false
duplicate_report: results/dataset_duplicates.json
output: results/fabric_predictions.json
vis_dir: results/annotated
no_vis: false
# device 默认自动选择 CUDA（可用时），也可用 --device cuda 显式指定。
